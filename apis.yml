aid: agraga
name: Agraga
description: Agraga (operated by Virya Logistics Technologies Private Limited) is a Chennai, India based digital
  cross-border logistics platform founded in 2021 by Anoop Raghavan and Venkatesh Narayanaswamy. It positions itself
  as a single operator for every leg of a shipment, bringing ocean freight, air freight, domestic transport, customs
  broking, warehousing, e-commerce fulfilment and embedded trade finance onto one booking and tracking platform aimed
  at underserved Indian MSME exporters and importers. It reports 700+ customers and 1,000+ vendors across 40-plus
  markets, and raised INR 100 crore in a pre-Series B round led by Bajaj Finserv with IvyCap Ventures. As of this
  profile Agraga publishes no public developer program, API documentation, SDK or machine-readable API contract; its
  platform backends are private and answer every anonymous request with an authentication error.
